        document.head.appendChild(style);

        let fittedStage;
        let fittedTransform;
        const fitDemoStage = () => {
          const stageWrapper = document.querySelector('[class*="stage_stage-wrapper_"]');
          const stage = stageWrapper?.querySelector('[class*="stage_stage_"]');
          if (!stage || !stageWrapper) return false;
          // Offset dimensions are untransformed, so fitting remains stable on every resize.
          const w = stage.offsetWidth || 480;
          const h = stage.offsetHeight || 360;
          const maxScale = params.get('fitStage') === 'true' ? Infinity : 1;
          const scale = Math.min(maxScale, window.innerWidth / w, window.innerHeight / h);
          if (!Number.isFinite(scale) || scale <= 0) return false;
          const transform = `translate(-50%, -50%) scale(${scale})`;
          if (fittedStage !== stageWrapper || fittedTransform !== transform) {
            fittedStage = stageWrapper;
            fittedTransform = transform;
            stageWrapper.style.setProperty('transform', transform, 'important');
            // Scratch caches the canvas rectangle. Notify it after CSS scaling
            // so mouse sensing uses the same coordinates as the visible stage.
            window.dispatchEvent(new Event('resize'));
          }
          document.documentElement.classList.add('demo-stage-mounted');
          return true;
        };
        // GUI and the SB3 are initialized asynchronously. Refit after both mount.
        const fitTimer = setInterval(fitDemoStage, 250);
        setTimeout(() => clearInterval(fitTimer), 15000);
        window.addEventListener('resize', fitDemoStage);
        const refreshPointerBounds = (event) => {
          if (event.target === fittedStage?.querySelector('canvas')) {
            window.dispatchEvent(new Event('resize'));
          }
        };

        document.addEventListener('touchstart', refreshPointerBounds, { capture: true, passive: true });

      function configureScratchToolbox() {
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (!vm?.editingTarget) return false;

        vm.runtime._primitives.sensing_online ??= () => navigator.onLine;
        vm.runtime.monitorBlockInfo.sensing_online ??= { getId: () => 'online' };
        if (isPlayerOnly) return true;

        const workspace = window.Blockly?.getMainWorkspace?.();
        if (!workspace) return false;
        if (workspace.__algoFullToolbox) return true;

        // Keep Scratch's own toolbox so menus, monitors and extensions
        // update with the selected target and the project's contents.
        const updateToolbox = workspace.updateToolbox.bind(workspace);
        workspace.updateToolbox = function (toolbox) {
          if (typeof toolbox === 'string' && !toolbox.includes('type="sensing_online"')) {
            toolbox = toolbox.replace(/(<block type="sensing_username"[^>]*\/>)/,
              '<block id="online" type="sensing_online"/>$1');
          }
          return updateToolbox(toolbox);
        };
        workspace.__algoFullToolbox = true;
        // The first toolbox may already have rendered before the bridge attached.
        const currentToolbox = workspace.options.languageTree;
        if (currentToolbox) {
          const xml = typeof currentToolbox === 'string'
            ? currentToolbox
            : new XMLSerializer().serializeToString(currentToolbox);
          workspace.updateToolbox(xml);
        }
        return true;
      }

      function resolveProjectTitle(url, level, explicitTitle) {
        let raw = '';
        if (explicitTitle && explicitTitle.trim()) {
          raw = explicitTitle.trim();
        } else {
          const cleanKey = url ? url.split('/').pop().replace(/\.sb3?$/i, '') : '';
          const is19097 = (url && url.includes('19097')) ||
                          window.location.search.includes('19097') ||
                          [
                            '9097624', '9097732', '9097811', '10653299', '9098276', '2660241',
                            '9098728', '2660096', '9099214', '2660244'
                          ].includes(cleanKey);

          if (is19097) {
            if (PROJECT_TITLE_MAP[`19097_${cleanKey}`]) raw = PROJECT_TITLE_MAP[`19097_${cleanKey}`];
            else if (PROJECT_TITLE_MAP[`19097_level_${level}`]) raw = PROJECT_TITLE_MAP[`19097_level_${level}`];
            else if (PROJECT_TITLE_MAP[`19097_${level}`]) raw = PROJECT_TITLE_MAP[`19097_${level}`];
          }
          if (!raw && PROJECT_TITLE_MAP[cleanKey]) {
            raw = PROJECT_TITLE_MAP[cleanKey];
          }
          // If cleanKey has a readable name (e.g. M1L4_A_rocketship, Clicker), derive from it!
          if (!raw && cleanKey && !cleanKey.match(/^\d+$/)) {
            raw = cleanKey.replace(/[_]+/g, ' ').trim();
          }
          // Only fallback to level_1..level_11 if this is explicitly M1L1 (18343)
          const is18343 = (url && url.includes('18343')) || window.location.search.includes('18343');
          if (!raw && is18343 && PROJECT_TITLE_MAP[`level_${level}`]) {
            raw = PROJECT_TITLE_MAP[`level_${level}`];
          }
          if (!raw) raw = cleanKey ? cleanKey.replace(/[_]+/g, ' ').trim() : 'Scratch Project';
        }

        // Remove en-dash / em-dash to match Image 2 (e.g. "M1L1 add a backdrop for a mermaid")
        return raw.replace(/\s*[–—]\s*/g, ' ').trim();
      }

      function ensureTitleInput(title) {
        if (isPlayerOnly) return false;
        const tabList = document.querySelector('ul[class*="gui_tab-list_"]') || document.querySelector('ul[class*="react-tabs__tab-list"]');
        if (!tabList) return false;

        const cleanTitle = (title || expectedTitle || '').replace(/\s*[–—]\s*/g, ' ').trim();
        let input = document.getElementById('algo-stage-title-input');
        if (!input) {
          input = document.createElement('input');
          input.id = 'algo-stage-title-input';
          input.className = 'algo-stage-title-input';
          input.type = 'text';
          input.value = cleanTitle;
          input.title = 'Project Title';
          input.addEventListener('change', (e) => {
            applyProjectTitle(e.target.value);
          });
          tabList.appendChild(input);
        } else {
          if (input.parentNode !== tabList) {
            tabList.appendChild(input);
          }
          if (cleanTitle && input.value !== cleanTitle && document.activeElement !== input) {
            input.value = cleanTitle;
          }
        }
        return true;
      }

      function applyProjectTitle(title) {
        if (!title) return;
        const cleanTitle = title.replace(/\s*[–—]\s*/g, ' ').trim();
        const loader = window.__scratchProjectLoader;
        if (loader && loader.props && typeof loader.props.onSetProjectTitle === 'function') {
          try {
            loader.props.onSetProjectTitle(cleanTitle);
          } catch (err) {
            console.warn('[AlgoLMS Bridge] Error setting project title on loader:', err);
          }
        }
        try {
          const titleInputs = document.querySelectorAll('input[class*="title-field"]');
          titleInputs.forEach(input => {
            if (input && input.value !== cleanTitle) {
              input.value = cleanTitle;
              input.dispatchEvent(new Event('input', { bubbles: true }));
              input.dispatchEvent(new Event('change', { bubbles: true }));
            }
          });
        } catch (err) {
          console.warn('[AlgoLMS Bridge] Error updating title input field:', err);
        }

        try {
          // If legacy controls group exists, restore controls to stage menu
          const staleGroup = document.getElementById('algo-stage-controls-group');
          if (staleGroup) {
            const controls = staleGroup.querySelector('div[class*="controls_controls-container_"]');
            if (controls && staleGroup.parentNode) {
              staleGroup.parentNode.insertBefore(controls, staleGroup);
            }
            staleGroup.remove();
          }

          ensureTitleInput(cleanTitle);
        } catch (err) {}
      }

      // 4. Resolve & Load Project natively into Scratch VM
      function resolveProjectUrl(param, level) {
        if (!param || !String(param).trim()) return null;
        if (param.startsWith('/') || param.startsWith('http')) return param;
        if (param.includes('.sb3')) {
          const cleanName = param.replace(/^.*[\\\/]/, '');
          return `/starter-projects/${cleanName}`;
        }

        const is19097 = [
          '9097624', '9097732', '9097811', '10653299', '9098276', '2660241',
          '9098728', '2660096', '9099214', '2660244'
        ].includes(String(param)) ||
        String(param).includes('19097') ||
        (String(param).includes('demo') && window.location.search.includes('M1L2')) ||
        window.location.search.includes('19097');

        if (is19097) {
          if (param && (/^\d+$/.test(param) || param.includes('demo'))) {
            return `/starter-projects/19097/${param}.sb3`;
          }
          return null;
        }

        const is19846 = [
          '9633775', '9633740', '9633799', '10661509', '9633847', '10661520',
          '9633998', '10661531', '9634062', '6112716', '9634094', '9634110',
          '9634128', '10661609'
        ].includes(String(param)) ||
        String(param).includes('19846') ||
        (String(param).includes('demo') && window.location.search.includes('M1L3') && !window.location.search.includes('M1L3_2')) ||
        window.location.search.includes('19846');

        if (is19846) {
          if (param && (/^\d+$/.test(param) || param.includes('demo') || param.includes('level'))) {
            return `/starter-projects/19846/${param}.sb3`;
          }
          return null;
        }

        const is19847 = [
          '9639729', '9639743', '9639758', '9639774', '9639793'
        ].includes(String(param)) ||
        String(param).includes('19847') ||
        window.location.search.includes('M1L3_2') ||
        window.location.search.includes('19847');

        if (is19847) {
          if (param && (/^\d+$/.test(param) || param.includes('demo') || param.includes('level'))) {
            return `/starter-projects/19847/${param}.sb3`;
          }
          return null;
        }

        if (param && /^\d+$/.test(param)) {
          return `/starter-projects/18343/${param}.sb3`;
        }
        return null;
      }

      function refreshEditorAfterProjectLoad(vm) {
        if (!isPlayerOnly) {
          // Scratch only shows its variable commands if the project has a scalar variable.
          const stage = vm.runtime.getTargetForStage();
          const hasVariable = vm.runtime.targets.some(target =>
            Object.values(target.variables).some(variable => variable.type === '')
          );
          if (stage && !hasVariable) {
            let id = 'algo-default-variable';
            while (vm.runtime.targets.some(target => target.variables[id])) id += '-';
            stage.createVariable(id, 'my variable', '', false);
          }
        }
        if (!isPlayerOnly && (!vm.editingTarget || vm.editingTarget.isStage)) {
          const sprite = vm.runtime.targets.find(target => !target.isStage && target.isOriginal);
          if (sprite) {
            vm.setEditingTarget(sprite.id);
            return;
          }
        }
        vm.refreshWorkspace();
      }

      function registerLibraryAssetFallback(vm) {
        const storage = vm.runtime.storage;
        if (!storage || storage.__algoLibraryAssetFallback) return;

        // This standalone Scratch build ships without its asset fetch worker.
        // Use Scratch Storage's existing fetch transport so downloads cannot
        // stall waiting for a response from the missing worker.
        const assetTool = storage.webHelper?.assetTool;
        if (assetTool?.tools?.some(tool => tool.isGetSupported && tool.isSendSupported)) {
          assetTool.tools = assetTool.tools.filter(tool => tool.isSendSupported);
        }

        const { ImageVector, ImageBitmap, Sound } = storage.AssetType;
        storage.addWebStore([ImageVector, ImageBitmap, Sound], asset =>
          `https://cdn.assets.scratch.mit.edu/internalapi/asset/${asset.assetId}.${asset.dataFormat}/get/`
        );
        storage.__algoLibraryAssetFallback = true;
      }

      const boundDemoVMs = new WeakSet();
      function bindDemoVM(vm) {
        if (boundDemoVMs.has(vm)) return;
        boundDemoVMs.add(vm);

        const postIOData = vm.postIOData.bind(vm);
        vm.postIOData = (device, data) => {
          if (device === 'mouse') {
            const canvas = vm.renderer?.canvas;
            const width = canvas?.clientWidth;
            const height = canvas?.clientHeight;
            // GUI sends scaled CSS pixels, but renderer picking uses layout pixels.
            if (width && height && data.canvasWidth && data.canvasHeight) {
              data = {
                ...data,
                x: data.x * width / data.canvasWidth,
                y: data.y * height / data.canvasHeight,
                canvasWidth: width,
                canvasHeight: height,
              };
            }
          }
          return postIOData(device, data);
        };

        const reportRunning = (running) => window.parent.postMessage(
          { type: 'SCRATCH_DEMO_RUNNING', running }, window.location.origin,
        );
        vm.on('PROJECT_RUN_START', () => reportRunning(true));
        vm.on('PROJECT_RUN_STOP', () => reportRunning(false));
        vm.on('PROJECT_STOP_ALL', () => reportRunning(false));
      }

      async function loadProjectFile(url) {
        if (!url) return false;
        console.log('[AlgoLMS Bridge] Fetching project:', url);
        try {
          let arrayBuffer = url === initialProjectUrl && prefetchedProject ? await prefetchedProject : null;
          if (!arrayBuffer) {
            const res = await fetch(url);
            if (!res.ok) {
              console.warn('[AlgoLMS Bridge] Failed to fetch project:', url, res.status);
              return false;
            }
            arrayBuffer = await res.arrayBuffer();
          }

          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm) {
            console.log('[AlgoLMS Bridge] Loading arrayBuffer directly into VM...');
            await vm.loadProject(arrayBuffer);
            console.log('[AlgoLMS Bridge] Project successfully loaded into VM!');
            if (isPlayerOnly) {
              bindDemoVM(vm);
              configureScratchToolbox();
              // Never signal readiness before the SB3 has completed loading.
              window.__algoDemoLoaded = true;
              window.parent.postMessage({ type: 'SCRATCH_DEMO_READY' }, window.location.origin);
              return true;
            }
            refreshEditorAfterProjectLoad(vm);
            const finalTitle = resolveProjectTitle(url, levelParam, titleParam);
            applyProjectTitle(finalTitle);

            // VM loading is independent of Scratch's file-upload Redux state.
            // onLoadingFinished is only valid after requestProjectUpload; calling it
            // here dispatches undefined when the GUI is already showing a project.
            configureScratchToolbox();
            setTimeout(configureScratchToolbox, 100);
            setTimeout(configureScratchToolbox, 400);
            setTimeout(configureScratchToolbox, 1000);
            setTimeout(() => applyProjectTitle(finalTitle), 200);
            setTimeout(() => applyProjectTitle(finalTitle), 800);
            return true;
          }
        } catch (e) {
          console.error('[AlgoLMS Bridge] Error fetching or loading project:', e);
        }
        return false;
      }

      const initialProjectUrl = resolveProjectUrl(projectUrl, levelParam);
      // Download in parallel with GUI initialization instead of waiting for its VM.
      const prefetchedProject = initialProjectUrl
        ? fetch(initialProjectUrl).then(async response => response.ok ? response.arrayBuffer() : null).catch(() => null)
        : null;
      const expectedTitle = resolveProjectTitle(initialProjectUrl, levelParam, titleParam);

      // IndexedDB Storage Helpers for Project Persistence across lessons/weeks
      const DB_NAME = 'AlgoLMS_ScratchProjects';
      const STORE_NAME = 'projects';

      function openProjectDb() {
        return new Promise((resolve) => {
          if (!window.indexedDB) return resolve(null);
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      }

      async function getSavedProject(key) {
        if (!key) return null;
        try {
          const db = await openProjectDb();
          if (!db) return null;
          return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          });
        } catch (e) {
          return null;
        }
      }

      // The shared chatbot must finish restoring before it can replace its draft.
      let chatbotReadyToSave = storageKeyParam !== 'M5L5_Shared_Chatbot';

      const cloudDraft = window.vp2ScratchDraft;
      const scopedStorageKey = params.has('draftScope') ? cloudDraft?.localKey : storageKeyParam;
      let restoringDraft = Boolean(cloudDraft);
      let savingCloudDraft = false;

      window.saveProjectToStorage = async function(key, syncCloud = false) {
        const k = scopedStorageKey;
        if (restoringDraft || savingCloudDraft || (syncCloud && !cloudDraft)) return false;
        if (!k || !chatbotReadyToSave) return false;
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (!vm || typeof vm.saveProjectSb3 !== 'function') return false;
        if (syncCloud) savingCloudDraft = true;
        try {
          const blob = await vm.saveProjectSb3();
          const buffer = await blob.arrayBuffer();
          if (syncCloud) await cloudDraft.save(buffer);
          const db = await openProjectDb();
          if (!db) return syncCloud;
          const saved = await new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(cloudDraft ? { buffer, cloudHash: cloudDraft.cloudHash } : buffer, k);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
            tx.onabort = () => resolve(false);
          });
          if (!saved) return syncCloud;
          console.log('[AlgoLMS] Saved project to storage for key:', k);
          if (!cloudDraft) window.parent.postMessage({ type: 'PROJECT_SAVED_SUCCESS' }, window.location.origin);
          return true;
        } catch (err) {
          console.error('[AlgoLMS] Failed to save project to storage:', err);
          return false;
        } finally {
          if (syncCloud) savingCloudDraft = false;
        }
      };

      if (storageKeyParam) {
        setInterval(() => {
          window.saveProjectToStorage(storageKeyParam);
        }, 30000);
        window.addEventListener('beforeunload', () => {
          window.saveProjectToStorage(storageKeyParam);
        });
      }

      if (!initialProjectUrl && !storageKeyParam) {
        // Level 1: Default Cat. Wait for Blockly workspace to be ready then apply Level 1 toolbox & title
        let checks = 0;
        const blocklyInterval = setInterval(() => {
          checks++;
          applyProjectTitle(expectedTitle);
          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm?.runtime?.storage) registerLibraryAssetFallback(vm);
          if (configureScratchToolbox()) {
            clearInterval(blocklyInterval);
            setTimeout(() => applyProjectTitle(expectedTitle), 200);
            setTimeout(() => applyProjectTitle(expectedTitle), 800);
          }
          if (checks > 100) {
            clearInterval(blocklyInterval);
          }
        }, 150);
      } else {
        // Levels 2+ or Shared Projects: Wait for Scratch VM to complete its initial boot
        let attempts = 0;
        let projectLoaded = false;
        const loaderCheck = setInterval(async () => {
          attempts++;
          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm && vm.runtime && Array.isArray(vm.runtime.targets) && vm.runtime.targets.length > 0 && !projectLoaded) {
            projectLoaded = true;
            clearInterval(loaderCheck);
            registerLibraryAssetFallback(vm);

            // First check if a saved project exists in IndexedDB for this storageKey
            let loadedFromStorage = false;
            let hadSavedProject = false;
            let savedDraftLoadFailed = false;
            if (scopedStorageKey) {
              const localProject = await getSavedProject(scopedStorageKey);
              let savedBuffer = cloudDraft ? localProject?.buffer : localProject;
              if (cloudDraft) {
                try {
                  savedBuffer = await cloudDraft.restore(localProject);
                } catch {
                  window.parent.postMessage({ type: 'PROJECT_RESTORE_FAILED' }, window.location.origin);
                }
              }
              if (savedBuffer) {
                hadSavedProject = true;
                console.log('[AlgoLMS Bridge] Restoring saved project for key:', storageKeyParam);
                try {
                  await vm.loadProject(savedBuffer);
                  refreshEditorAfterProjectLoad(vm);
                  loadedFromStorage = true;
                  setTimeout(configureScratchToolbox, 100);
                  setTimeout(configureScratchToolbox, 500);
                } catch (loadErr) {
                  savedDraftLoadFailed = true;
                  console.warn('[AlgoLMS Bridge] Could not restore saved project, falling back to starter:', loadErr);
                }
              }
            }

            if (savedDraftLoadFailed && cloudDraft) {
              window.parent.postMessage({ type: 'PROJECT_RESTORE_FAILED' }, window.location.origin);
            }

            if (!loadedFromStorage && initialProjectUrl) {
              const loaded = await loadProjectFile(initialProjectUrl);
              if (isPlayerOnly && !loaded) {
                window.parent.postMessage({ type: 'SCRATCH_DEMO_ERROR' }, window.location.origin);
              }
            }
            if (storageKeyParam === 'M5L5_Shared_Chatbot') {
              chatbotReadyToSave = loadedFromStorage || !hadSavedProject;
            }
            restoringDraft = false;
          }
          if (attempts > 300) {
            clearInterval(loaderCheck);
          }
        }, 100);
      }

      // Keep checking for tab-list to attach title input when Scratch editor mounts
      const tabTitleWatch = setInterval(() => {
        ensureTitleInput(expectedTitle);
      }, 150);
      setTimeout(() => clearInterval(tabTitleWatch), 8000);

      // Algo LMS Native File & Edit Actions Bridge
      window.loadProjectFromComputer = function() {
        if (window.__scratchProjectLoader && typeof window.__scratchProjectLoader.handleStartSelectingFileUpload === 'function') {
          window.__scratchProjectLoader.handleStartSelectingFileUpload();
          return;
        }
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.sb,.sb2,.sb3';
        input.style.display = 'none';
        input.onchange = async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const arrayBuffer = await file.arrayBuffer();
          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm) {
            await vm.loadProject(arrayBuffer);
            refreshEditorAfterProjectLoad(vm);
            const title = file.name.replace(/\.sb[23]?$/i, '');
            applyProjectTitle(title);
            configureScratchToolbox();
          }
          input.remove();
        };
        document.body.appendChild(input);
        input.click();
      };

      window.saveProjectToComputer = async function(customTitle) {
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (!vm) {
          console.warn('[AlgoLMS] Scratch VM not ready for save');
          return false;
        }
        try {
          const blob = await vm.saveProjectSb3();
          const stageInput = document.getElementById('algo-stage-title-input');
          const finalTitle = customTitle || stageInput?.value?.trim() || expectedTitle || 'project';
          const filename = finalTitle.endsWith('.sb3') ? finalTitle : (finalTitle + '.sb3');
          const blobUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = blobUrl;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          setTimeout(() => {
            document.body.removeChild(link);
            URL.revokeObjectURL(blobUrl);
          }, 1000);
          return true;
        } catch (err) {
          console.error('[AlgoLMS] Error saving project to computer:', err);
          return false;
        }
      };

      window.revertToDraftProject = async function() {
        if (initialProjectUrl) {
          await loadProjectFile(initialProjectUrl);
        } else {
          window.location.reload();
        }
      };

      window.toggleTurboMode = function() {
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (vm && vm.runtime) {
          const next = !vm.runtime.turboMode;
          vm.setTurboMode(next);
          try {
            window.parent.postMessage({ type: 'TURBO_MODE_CHANGED', turboMode: next }, '*');
          } catch (e) {}
          return next;
        }
        return false;
      };

      window.getTurboMode = function() {
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        return !!(vm?.runtime?.turboMode);
      };

      window.restoreLastItem = function() {
        if (window.__lastRestoreFun && typeof window.__lastRestoreFun === 'function') {
          window.__lastRestoreFun();
          window.__lastRestoreFun = null;
          return true;
        }
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (vm && typeof vm.restoreTarget === 'function') {
          return vm.restoreTarget();
        }
        return false;
      };

      // Wrap delete methods to capture restore function for Edit -> Restore
      const checkVmForRestore = setInterval(() => {
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (vm) {
          clearInterval(checkVmForRestore);
          const origDeleteCostume = vm.deleteCostume?.bind(vm);
          if (origDeleteCostume) {
            vm.deleteCostume = function(idx) {
              const res = origDeleteCostume(idx);
              window.__lastRestoreFun = res;
              return res;
            };
          }
          const origDeleteSound = vm.deleteSound?.bind(vm);
          if (origDeleteSound) {
            vm.deleteSound = function(idx) {
              const res = origDeleteSound(idx);
              window.__lastRestoreFun = res;
              return res;
            };
          }
        }
      }, 200);

      // Listen for parent LMS postMessage
      window.addEventListener('message', async (e) => {
        if (!e.data) return;
        if (isPlayerOnly && e.source === window.parent && e.origin === window.location.origin) {
          if (e.data.type === 'SCRATCH_DEMO_PING') {
            if (window.__algoDemoLoaded) {
              window.parent.postMessage({ type: 'SCRATCH_DEMO_READY' }, window.location.origin);
            }
            return;
          }
          if (e.data.type === 'SCRATCH_DEMO_RUN' || e.data.type === 'SCRATCH_DEMO_STOP') {
            const demoVm = window.vm || window.__scratchProjectLoader?.props?.vm;
            if (!window.__algoDemoLoaded || !demoVm) return;
            if (e.data.type === 'SCRATCH_DEMO_STOP') {
              if (typeof demoVm.stopAll === 'function') demoVm.stopAll();
            } else {
              if (typeof demoVm.greenFlag === 'function') demoVm.greenFlag();
              else demoVm.runtime?.startHats?.('event_whenflagclicked');
            }
            return;
          }
        }
        if (e.data.type === 'LOAD_SB3' && e.data.url) {
          await loadProjectFile(e.data.url);
        }
        if (e.data.type === 'LOAD_FROM_COMPUTER') {
          window.loadProjectFromComputer();
        }
        if (e.data.type === 'SAVE_TO_COMPUTER') {
          window.saveProjectToComputer(e.data.title);
        }
        if (e.data.type === 'SAVE_TO_STORAGE') {
          if (e.source !== window.parent || e.origin !== window.location.origin) return;
          const saved = await window.saveProjectToStorage(storageKeyParam, params.has('draftScope'));
          if (params.has('draftScope') || !saved) {
            window.parent.postMessage({
              type: saved ? 'PROJECT_SAVED_SUCCESS' : 'PROJECT_SAVE_FAILED',
            }, window.location.origin);
          }
        }
        if (e.data.type === 'REVERT_DRAFT_PROJECT') {
          window.revertToDraftProject();
        }
        if (e.data.type === 'TOGGLE_TURBO_MODE') {
          window.toggleTurboMode();
        }
        if (e.data.type === 'RESTORE_LAST_ITEM') {
          window.restoreLastItem();
        }
        if (e.data.type === 'SET_PROJECT_TITLE' && e.data.title) {
          applyProjectTitle(e.data.title);
        }

      });
    })();
  </script>
