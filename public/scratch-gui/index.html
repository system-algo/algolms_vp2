            max-height: none !important;

          const stageWrapper = document.querySelector('[class*="stage_stage-wrapper_"]');
          const stage = stageWrapper?.querySelector('[class*="stage_stage_"]');
          if (!stage || !stageWrapper) return false;
          // Offset dimensions are untransformed, so fitting remains stable on every resize.
          const w = stage.offsetWidth || 480;
          const h = stage.offsetHeight || 360;
          const scale = Math.min(1, window.innerWidth / w, window.innerHeight / h);
          if (!Number.isFinite(scale) || scale <= 0) return false;
          stageWrapper.style.setProperty('transform', `translate(-50%, -50%) scale(${scale})`, 'important');
          document.documentElement.classList.add('demo-stage-mounted');
          return true;
        };
        // GUI and the SB3 are initialized asynchronously. Refit after both mount.
        const fitTimer = setInterval(fitDemoStage, 250);
        setTimeout(() => clearInterval(fitTimer), 15000);
        window.addEventListener('resize', fitDemoStage);

      // 1. Dynamic category & block parsing & normalisation
      const categoriesParam = (params.get('categories') || '').trim();
      let allowedCategories = categoriesParam

      // Normalize category aliases between LMS manifests and Scratch 3.0 Blockly:
      if (allowedCategories.includes('variables') && !allowedCategories.includes('data')) {
        allowedCategories.push('data');
      }
      if (allowedCategories.includes('data') && !allowedCategories.includes('variables')) {
        allowedCategories.push('variables');

      if (allowedCategories.includes('myblocks') && !allowedCategories.includes('procedures')) {
        allowedCategories.push('procedures');

        allowedCategories.push('myblocks');

      const baseMainCategories = ['motion', 'looks', 'sound', 'events', 'control', 'sensing', 'operators', 'variables'];
      const isFullToolbox = true; // Always allow full toolbox per user instruction

      const VARIABLES_XML = `
  <category name="Variables" id="data" colour="#FF8C1A" secondaryColour="#DB6E00" custom="VARIABLE"/>`;

      const MYBLOCKS_XML = `
  <category name="My Blocks" id="myBlocks" colour="#FF6680" secondaryColour="#FF4D6A" custom="PROCEDURE"/>`;

      function filterCategoryXmlBlocks(categoryXmlStr, allowedBlockTypes) {
        if (!allowedBlockTypes || allowedBlockTypes.length === 0) return categoryXmlStr;
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(`<root>${categoryXmlStr}</root>`, 'text/xml');
          const blocks = Array.from(doc.querySelectorAll('category > block'));
          blocks.forEach(b => {
            const type = (b.getAttribute('type') || '').toLowerCase();
            if (!allowedBlockTypes.includes(type)) {
              b.remove();
            }
          });
          const cat = doc.querySelector('category');
          if (!cat) return '';
          const serializer = new XMLSerializer();
          return serializer.serializeToString(cat);
        } catch (err) {
          return categoryXmlStr;
        }
      }

      function buildDynamicToolboxXml(allowed, allowedBlockTypes) {
        let xml = '<xml id="toolbox" style="display: none">\n';
        if (allowed.includes('motion')) xml += filterCategoryXmlBlocks(MOTION_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('looks')) xml += filterCategoryXmlBlocks(LOOKS_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('sound')) xml += filterCategoryXmlBlocks(SOUND_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('events')) xml += filterCategoryXmlBlocks(EVENTS_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('control')) xml += filterCategoryXmlBlocks(CONTROL_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('sensing')) xml += filterCategoryXmlBlocks(SENSING_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('operators')) xml += filterCategoryXmlBlocks(OPERATORS_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('variables') || allowed.includes('data')) xml += filterCategoryXmlBlocks(VARIABLES_XML, allowedBlockTypes) + '\n';
        if (allowed.includes('myblocks') || allowed.includes('procedures')) xml += filterCategoryXmlBlocks(MYBLOCKS_XML, allowedBlockTypes) + '\n';
        xml += '</xml>';
        return xml;
      }

      // Targeted CSS rules to prevent flicker of disallowed categories
      const categoryClassMap = {
        motion: '.scratchCategoryId-motion',
        looks: '.scratchCategoryId-looks',
        sound: '.scratchCategoryId-sound',
        events: '.scratchCategoryId-events',
        control: '.scratchCategoryId-control',
        sensing: '.scratchCategoryId-sensing',
        operators: '.scratchCategoryId-operators',
        variables: '.scratchCategoryId-variables, .scratchCategoryId-data',
        data: '.scratchCategoryId-variables, .scratchCategoryId-data',
        myblocks: '.scratchCategoryId-myBlocks, .scratchCategoryId-procedures',
        procedures: '.scratchCategoryId-myBlocks, .scratchCategoryId-procedures'
      };

      const filterStyleElement = document.createElement('style');
      filterStyleElement.id = 'algo-lms-toolbox-filter';

      function updateCssFilter(disallowedList) {
        if (isFullToolbox || disallowedList.length === 0) {
          filterStyleElement.textContent = '';
          return;
        }
        const cssRules = [];
        disallowedList.forEach(cat => {
          if (categoryClassMap[cat]) {
            cssRules.push(`${categoryClassMap[cat]} { display: none !important; }`);
          }
        });
        filterStyleElement.textContent = cssRules.join('\n');
      }

      updateCssFilter(disallowed);
      document.head.appendChild(filterStyleElement);

      // 2. Native Blockly updateToolbox hook: intercept all updateToolbox calls
      function filterToolboxXml(rawXml, allowed, allowedBlockTypes) {
        if (isFullToolbox && (!allowedBlockTypes || allowedBlockTypes.length === 0)) return rawXml;
        try {
          const parser = new DOMParser();
          const doc = parser.parseFromString(rawXml, 'text/xml');
          const catAliases = {
            event: 'events',
            events: 'events',
            data: 'variables',
            variables: 'variables',
            procedures: 'myblocks',
            myblocks: 'myblocks'
          };
          const allowedNorm = allowed.map(c => catAliases[c] || c.toLowerCase());
          const cats = Array.from(doc.querySelectorAll('category'));
          cats.forEach(c => {
            const id = (c.getAttribute('id') || '').toLowerCase();
            const norm = catAliases[id] || id;
            if (!allowedNorm.includes(norm)) {
              c.remove();
            } else if (allowedBlockTypes && allowedBlockTypes.length > 0) {
              const blocks = Array.from(c.children).filter(el => el.tagName.toLowerCase() === 'block');
              blocks.forEach(b => {
                const type = (b.getAttribute('type') || '').toLowerCase();
                if (!allowedBlockTypes.includes(type)) {
                  b.remove();
                }
              });
            }
          });
          const serializer = new XMLSerializer();
          return serializer.serializeToString(doc);
        } catch (err) {
          console.warn('[AlgoLMS Bridge] filterToolboxXml error:', err);
          return rawXml;
        }
      }

      function hookWorkspaceToolbox(ws) {
        if (!ws || ws.__algoToolboxHooked) return;
        ws.__algoToolboxHooked = true;
        const originalUpdateToolbox = ws.updateToolbox.bind(ws);

        ws.updateToolbox = function(tree) {
          if (isFullToolbox && (!allowedBlocks || allowedBlocks.length === 0)) {
            return originalUpdateToolbox(tree);
          }
          if (typeof tree === 'string') {
            const filteredTree = filterToolboxXml(tree, allowedCategories, allowedBlocks);
            return originalUpdateToolbox(filteredTree);
          }
          if (tree && tree.querySelectorAll) {
            try {
              const catAliases = {
                event: 'events',
                events: 'events',
                data: 'variables',
                variables: 'variables',
                procedures: 'myblocks',
                myblocks: 'myblocks'
              };
              const allowedNorm = allowedCategories.map(c => catAliases[c] || c.toLowerCase());
              const cats = Array.from(tree.querySelectorAll('category'));
              cats.forEach(c => {
                const id = (c.getAttribute('id') || '').toLowerCase();
                const norm = catAliases[id] || id;
                if (!allowedNorm.includes(norm)) {
                  c.remove();
                } else if (allowedBlocks && allowedBlocks.length > 0) {
                  const blocks = Array.from(c.children).filter(el => el.tagName.toLowerCase() === 'block');
                  blocks.forEach(b => {
                    const type = (b.getAttribute('type') || '').toLowerCase();
                    if (!allowedBlocks.includes(type)) {
                      b.remove();
                    }
                  });
                }
              });
            } catch (err) {}
            return originalUpdateToolbox(tree);
          }
          return originalUpdateToolbox(tree);
        };

      function resolveProjectTitle(url, level, explicitTitle) {
        let raw = '';
        if (explicitTitle && explicitTitle.trim()) {
          raw = explicitTitle.trim();
        } else {
          const cleanKey = url ? url.split('/').pop().replace(/\.sb3?$/i, '') : '';
          const is19097 = (url && url.includes('19097')) ||
                          window.location.search.includes('19097') ||
                          [
                            '9097624', '9097732', '9097811', '10653299', '9098276', '2660241',
                            '9098728', '2660096', '9099214', '2660244'
                          ].includes(cleanKey);

          if (is19097) {
            if (PROJECT_TITLE_MAP[`19097_${cleanKey}`]) raw = PROJECT_TITLE_MAP[`19097_${cleanKey}`];
            else if (PROJECT_TITLE_MAP[`19097_level_${level}`]) raw = PROJECT_TITLE_MAP[`19097_level_${level}`];
            else if (PROJECT_TITLE_MAP[`19097_${level}`]) raw = PROJECT_TITLE_MAP[`19097_${level}`];
          }
          if (!raw && PROJECT_TITLE_MAP[cleanKey]) {
            raw = PROJECT_TITLE_MAP[cleanKey];
          }
          // If cleanKey has a readable name (e.g. M1L4_A_rocketship, Clicker), derive from it!
          if (!raw && cleanKey && !cleanKey.match(/^\d+$/)) {
            raw = cleanKey.replace(/[_]+/g, ' ').trim();
          }
          // Only fallback to level_1..level_11 if this is explicitly M1L1 (18343)
          const is18343 = (url && url.includes('18343')) || window.location.search.includes('18343');
          if (!raw && is18343 && PROJECT_TITLE_MAP[`level_${level}`]) {
            raw = PROJECT_TITLE_MAP[`level_${level}`];
          }
          if (!raw) raw = cleanKey ? cleanKey.replace(/[_]+/g, ' ').trim() : 'Scratch Project';
        }

        // Remove en-dash / em-dash to match Image 2 (e.g. "M1L1 add a backdrop for a mermaid")
        return raw.replace(/\s*[–—]\s*/g, ' ').trim();
      }

      function ensureTitleInput(title) {

          input.title = 'Project Title';
          input.addEventListener('change', (e) => {
            applyProjectTitle(e.target.value);
          });

        } else {
          if (input.parentNode !== tabList) {
            tabList.appendChild(input);
          }

            input.value = cleanTitle;

      function applyProjectTitle(title) {
        if (!title) return;
        const cleanTitle = title.replace(/\s*[–—]\s*/g, ' ').trim();
        const loader = window.__scratchProjectLoader;
        if (loader && loader.props && typeof loader.props.onSetProjectTitle === 'function') {

        try {

          console.warn('[AlgoLMS Bridge] Error updating title input field:', err);

      // 4. Resolve & Load Project natively into Scratch VM
      function resolveProjectUrl(param, level) {
        if (!param || !String(param).trim()) return null;
        if (param.startsWith('/') || param.startsWith('http')) return param;
        if (param.includes('.sb3')) {
          const cleanName = param.replace(/^.*[\\\/]/, '');
          return `/starter-projects/${cleanName}`;
        }

        const is19097 = [
          '9097624', '9097732', '9097811', '10653299', '9098276', '2660241',
          '9098728', '2660096', '9099214', '2660244'
        ].includes(String(param)) ||
        String(param).includes('19097') ||
        (String(param).includes('demo') && window.location.search.includes('M1L2')) ||
        window.location.search.includes('19097');

        if (is19097) {
          if (param && (/^\d+$/.test(param) || param.includes('demo'))) {
            return `/starter-projects/19097/${param}.sb3`;
          }
          return null;
        }

        const is19846 = [
          '9633775', '9633740', '9633799', '10661509', '9633847', '10661520',
          '9633998', '10661531', '9634062', '6112716', '9634094', '9634110',
          '9634128', '10661609'
        ].includes(String(param)) ||
        String(param).includes('19846') ||
        (String(param).includes('demo') && window.location.search.includes('M1L3') && !window.location.search.includes('M1L3_2')) ||
        window.location.search.includes('19846');

        if (is19846) {
          if (param && (/^\d+$/.test(param) || param.includes('demo') || param.includes('level'))) {
            return `/starter-projects/19846/${param}.sb3`;
          }
          return null;
        }

        const is19847 = [
          '9639729', '9639743', '9639758', '9639774', '9639793'
        ].includes(String(param)) ||
        String(param).includes('19847') ||
        window.location.search.includes('M1L3_2') ||
        window.location.search.includes('19847');

        if (is19847) {
          if (param && (/^\d+$/.test(param) || param.includes('demo') || param.includes('level'))) {
            return `/starter-projects/19847/${param}.sb3`;
          }
          return null;
        }

        if (param && /^\d+$/.test(param)) {
          return `/starter-projects/18343/${param}.sb3`;
        }
        return null;

      async function loadProjectFile(url) {
        if (!url) return false;
        console.log('[AlgoLMS Bridge] Fetching project:', url);
        try {
          let arrayBuffer = url === initialProjectUrl && prefetchedProject ? await prefetchedProject : null;
          if (!arrayBuffer) {
            const res = await fetch(url);
            if (!res.ok) {
              console.warn('[AlgoLMS Bridge] Failed to fetch project:', url, res.status);
              return false;
            }
            arrayBuffer = await res.arrayBuffer();
          }

          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm) {
            console.log('[AlgoLMS Bridge] Loading arrayBuffer directly into VM...');
            await vm.loadProject(arrayBuffer);
            console.log('[AlgoLMS Bridge] Project successfully loaded into VM!');
            if (typeof vm.emitTargetsUpdate === 'function') {
              vm.emitTargetsUpdate();
            }
            if (typeof vm.emitWorkspaceUpdate === 'function') {
              vm.emitWorkspaceUpdate();
            }
            const finalTitle = resolveProjectTitle(url, levelParam, titleParam);
            applyProjectTitle(finalTitle);

            // VM loading is independent of Scratch's file-upload Redux state.
            // onLoadingFinished is only valid after requestProjectUpload; calling it
            // here dispatches undefined when the GUI is already showing a project.
            setTimeout(applyBlocklyToolbox, 100);
            setTimeout(applyBlocklyToolbox, 400);
            setTimeout(applyBlocklyToolbox, 1000);
            setTimeout(() => applyProjectTitle(finalTitle), 200);
            setTimeout(() => applyProjectTitle(finalTitle), 800);
            if (isPlayerOnly) {
              // Never signal readiness before the SB3 has completed loading.
              window.__algoDemoLoaded = true;
              window.parent.postMessage({ type: 'SCRATCH_DEMO_READY' }, window.location.origin);
            }
            return true;
          }
        } catch (e) {
          console.error('[AlgoLMS Bridge] Error fetching or loading project:', e);
        }
        return false;
      }

      const initialProjectUrl = resolveProjectUrl(projectUrl, levelParam);
      // Download in parallel with GUI initialization instead of waiting for its VM.
      const prefetchedProject = initialProjectUrl
        ? fetch(initialProjectUrl).then(async response => response.ok ? response.arrayBuffer() : null).catch(() => null)
        : null;
      const expectedTitle = resolveProjectTitle(initialProjectUrl, levelParam, titleParam);

      // IndexedDB Storage Helpers for Project Persistence across lessons/weeks
      const DB_NAME = 'AlgoLMS_ScratchProjects';
      const STORE_NAME = 'projects';

      function openProjectDb() {
        return new Promise((resolve) => {
          if (!window.indexedDB) return resolve(null);
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      }

      async function getSavedProject(key) {
        if (!key) return null;
        try {
          const db = await openProjectDb();
          if (!db) return null;
          return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get(key);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          });
        } catch (e) {
          return null;
        }
      }

      window.downloadPreviousGameProject = async function() {
        const buffer = await getSavedProject('M3L4_Shared_Game');
        if (!buffer) return false;
        const url = URL.createObjectURL(new Blob([buffer], { type: 'application/octet-stream' }));
        const link = document.createElement('a');
        link.href = url;
        link.download = 'M3L4 Game - previous project.sb3';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return true;
      };

      window.saveProjectToStorage = async function(key) {
        const k = key || storageKeyParam;
        if (!k) return false;
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (!vm || typeof vm.saveProjectSb3 !== 'function') return false;
        try {
          const blob = await vm.saveProjectSb3();
          const buffer = await blob.arrayBuffer();
          const db = await openProjectDb();
          if (!db) return false;
          const saved = await new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            tx.objectStore(STORE_NAME).put(buffer, k);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
            tx.onabort = () => resolve(false);
          });
          if (!saved) return false;
          canAutosave = true;
          console.log('[AlgoLMS] Saved project to storage for key:', k);
          window.parent.postMessage({ type: 'PROJECT_SAVED_SUCCESS', storageKey: k, timestamp: Date.now() }, '*');
          return true;
        } catch (err) {
          console.error('[AlgoLMS] Failed to save project to storage:', err);
          return false;
        }
      };

      if (storageKeyParam) {
        setInterval(() => {
          if (canAutosave) window.saveProjectToStorage(storageKeyParam);
        }, 30000);
        window.addEventListener('beforeunload', () => {
          if (canAutosave) window.saveProjectToStorage(storageKeyParam);
        });
      }

      if (!initialProjectUrl && (!storageKeyParam || startFresh)) {
        // Level 1: Default Cat. Wait for Blockly workspace to be ready then apply Level 1 toolbox & title
        let checks = 0;
        const blocklyInterval = setInterval(() => {
          checks++;
          applyProjectTitle(expectedTitle);
          if (applyBlocklyToolbox()) {
            clearInterval(blocklyInterval);
            setTimeout(() => applyProjectTitle(expectedTitle), 200);
            setTimeout(() => applyProjectTitle(expectedTitle), 800);
          }
          if (checks > 100) {
            clearInterval(blocklyInterval);
          }
        }, 150);
      } else {
        // Levels 2+ or Shared Projects: Wait for Scratch VM to complete its initial boot
        let attempts = 0;
        let projectLoaded = false;
        const loaderCheck = setInterval(async () => {
          attempts++;
          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm && vm.runtime && Array.isArray(vm.runtime.targets) && vm.runtime.targets.length > 0 && !projectLoaded) {
            projectLoaded = true;
            clearInterval(loaderCheck);

            // First check if a saved project exists in IndexedDB for this storageKey
            let loadedFromStorage = false;
            if (storageKeyParam) {
              const savedBuffer = await getSavedProject(storageKeyParam);
              if (savedBuffer) {
                console.log('[AlgoLMS Bridge] Restoring saved project for key:', storageKeyParam);
                try {
                  await vm.loadProject(savedBuffer);
                  if (typeof vm.emitTargetsUpdate === 'function') vm.emitTargetsUpdate();
                  if (typeof vm.emitWorkspaceUpdate === 'function') vm.emitWorkspaceUpdate();
                  loadedFromStorage = true;
                  setTimeout(applyBlocklyToolbox, 100);
                  setTimeout(applyBlocklyToolbox, 500);
                } catch (loadErr) {
                  console.warn('[AlgoLMS Bridge] Could not restore saved project, falling back to starter:', loadErr);
                }
              }
            }

            if (!loadedFromStorage && initialProjectUrl) {
              await loadProjectFile(initialProjectUrl);
            }
          }
          if (attempts > 300) {
            clearInterval(loaderCheck);
          }
        }, 100);
      }

      // Keep checking for tab-list to attach title input when Scratch editor mounts
      const tabTitleWatch = setInterval(() => {
        ensureTitleInput(expectedTitle);
      }, 150);
      setTimeout(() => clearInterval(tabTitleWatch), 8000);

      // Algo LMS Native File & Edit Actions Bridge

      window.saveProjectToComputer = async function(customTitle) {

      const checkVmForRestore = setInterval(() => {

        if (vm) {
          clearInterval(checkVmForRestore);
          const origDeleteCostume = vm.deleteCostume?.bind(vm);
          if (origDeleteCostume) {

      // Listen for parent LMS postMessage
      window.addEventListener('message', async (e) => {
        if (!e.data) return;
        if (isPlayerOnly && e.source === window.parent && e.origin === window.location.origin) {
          if (e.data.type === 'SCRATCH_DEMO_PING') {
            if (window.__algoDemoLoaded) {
              window.parent.postMessage({ type: 'SCRATCH_DEMO_READY' }, window.location.origin);
            }
            return;
          }
          if (e.data.type === 'SCRATCH_DEMO_RUN' || e.data.type === 'SCRATCH_DEMO_STOP') {
            const demoVm = window.vm || window.__scratchProjectLoader?.props?.vm;
            if (!window.__algoDemoLoaded || !demoVm) return;
            if (e.data.type === 'SCRATCH_DEMO_STOP') {
              if (typeof demoVm.stopAll === 'function') demoVm.stopAll();
            } else {
              if (typeof demoVm.greenFlag === 'function') demoVm.greenFlag();
              else demoVm.runtime?.startHats?.('event_whenflagclicked');
            }
            return;
          }
        }
        if (e.data.type === 'LOAD_SB3' && e.data.url) {

        if (e.data.type === 'LOAD_FROM_COMPUTER') {
          window.loadProjectFromComputer();

          window.saveProjectToComputer(e.data.title);
        }
        if (e.data.type === 'SAVE_TO_STORAGE') {
          await window.saveProjectToStorage(e.data.storageKey || storageKeyParam);
        }
        if (e.data.type === 'REVERT_DRAFT_PROJECT') {
          window.revertToDraftProject();
        }
        if (e.data.type === 'TOGGLE_TURBO_MODE') {
          window.toggleTurboMode();
        }
        if (e.data.type === 'RESTORE_LAST_ITEM') {
          window.restoreLastItem();
        }
        if (e.data.type === 'SET_PROJECT_TITLE' && e.data.title) {
          applyProjectTitle(e.data.title);
        }
        if (e.data.type === 'UPDATE_CATEGORIES' && e.data.categories) {
          const newCats = String(e.data.categories).split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
          allowedCategories = newCats;
          if (allowedCategories.includes('variables') && !allowedCategories.includes('data')) allowedCategories.push('data');
          if (allowedCategories.includes('data') && !allowedCategories.includes('variables')) allowedCategories.push('variables');
          if (allowedCategories.includes('myblocks') && !allowedCategories.includes('procedures')) allowedCategories.push('procedures');
          if (allowedCategories.includes('procedures') && !allowedCategories.includes('myblocks')) allowedCategories.push('myblocks');

          const newDisallowed = isFullToolbox ? [] : allCategories.filter(c => !allowedCategories.includes(c));
          updateCssFilter(newDisallowed);
          applyBlocklyToolbox();
        }
      });
    })();
  </script>
</head>
