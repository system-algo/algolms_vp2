      // 1. Dynamic category parsing & normalisation

      if (allowedCategories.includes('variables') && !allowedCategories.includes('data')) {

        allowedCategories.push('variables');

      if (allowedCategories.includes('myblocks') && !allowedCategories.includes('procedures')) {

      const MYBLOCKS_XML = `
  <category name="My Blocks" id="myBlocks" colour="#FF6680" secondaryColour="#FF4D6A" custom="PROCEDURE"/>`;

      function buildDynamicToolboxXml(allowed) {
        let xml = '<xml id="toolbox" style="display: none">\n';
        if (allowed.includes('motion')) xml += MOTION_XML + '\n';
        if (allowed.includes('looks')) xml += LOOKS_XML + '\n';
        if (allowed.includes('sound')) xml += SOUND_XML + '\n';
        if (allowed.includes('events')) xml += EVENTS_XML + '\n';
        if (allowed.includes('control')) xml += CONTROL_XML + '\n';
        if (allowed.includes('sensing')) xml += SENSING_XML + '\n';
        if (allowed.includes('operators')) xml += OPERATORS_XML + '\n';
        if (allowed.includes('variables') || allowed.includes('data')) xml += VARIABLES_XML + '\n';
        if (allowed.includes('myblocks') || allowed.includes('procedures')) xml += MYBLOCKS_XML + '\n';
        xml += '</xml>';
        return xml;
      }

      // Targeted CSS rules to prevent flicker of disallowed categories
      const categoryClassMap = {
        motion: '.scratchCategoryId-motion',
        looks: '.scratchCategoryId-looks',
        sound: '.scratchCategoryId-sound',
        events: '.scratchCategoryId-events',
        control: '.scratchCategoryId-control',
        sensing: '.scratchCategoryId-sensing',
        operators: '.scratchCategoryId-operators',
        variables: '.scratchCategoryId-variables, .scratchCategoryId-data',
        data: '.scratchCategoryId-variables, .scratchCategoryId-data',
        myblocks: '.scratchCategoryId-myBlocks, .scratchCategoryId-procedures',
        procedures: '.scratchCategoryId-myBlocks, .scratchCategoryId-procedures'
      };

      const blockPrefixMap = {
        motion: 'g[data-category="motion"], g[data-id^="motion_"]',
        looks: 'g[data-category="looks"], g[data-id^="looks_"]',
        sound: 'g[data-category="sound"], g[data-id^="sound_"]',
        events: 'g[data-category="events"], g[data-id^="event_"]',
        control: 'g[data-category="control"], g[data-id^="control_"]',
        sensing: 'g[data-category="sensing"], g[data-id^="sensing_"], g[data-id="sensing_of"]',
        operators: 'g[data-category="operators"], g[data-id^="operator_"]',
        variables: 'g[data-category="data"], g[data-id^="data_"]',
        data: 'g[data-category="data"], g[data-id^="data_"]',
        myblocks: 'g[data-category="myBlocks"], g[data-id^="procedures_"]',
        procedures: 'g[data-category="myBlocks"], g[data-id^="procedures_"]'
      };

      const filterStyleElement = document.createElement('style');
      filterStyleElement.id = 'algo-lms-toolbox-filter';

      function updateCssFilter(disallowedList) {
        if (isFullToolbox || disallowedList.length === 0) {
          filterStyleElement.textContent = '';
          return;
        }
        const cssRules = [];
        disallowedList.forEach(cat => {
          if (categoryClassMap[cat]) {
            cssRules.push(`${categoryClassMap[cat]} { display: none !important; }`);
          }
          if (blockPrefixMap[cat]) {
            cssRules.push(`${blockPrefixMap[cat]} { display: none !important; }`);
          }
        });
        if (disallowedList.includes('sensing')) {
          cssRules.push('g[data-id="sensing_of"], g[data-id*="sensing"] { display: none !important; }');
        }
        filterStyleElement.textContent = cssRules.join('\n');
      }

      updateCssFilter(disallowed);
      document.head.appendChild(filterStyleElement);

      // 2. Native Blockly updateToolbox hook
      function applyBlocklyToolbox() {
        if (!window.Blockly || !window.Blockly.getMainWorkspace) return false;
        const ws = window.Blockly.getMainWorkspace();
        if (!ws || !ws.options) return false;
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (!vm || !vm.runtime || !Array.isArray(vm.runtime.targets) || vm.runtime.targets.length === 0) return false;

        try {
          if (isFullToolbox) {
            // Full toolbox allowed (e.g. Free programming / Super cat) - keep native workspace intact
            return true;
          }
          const customXml = buildDynamicToolboxXml(allowedCategories);
          ws.updateToolbox(customXml);
          return true;
        } catch (err) {
          console.warn('[AlgoLMS Bridge] updateToolbox error:', err);
        }
        return false;
      }

      // 3. Project Title Resolver & Application

      function resolveProjectTitle(url, level, explicitTitle) {
        if (explicitTitle && explicitTitle.trim()) {
          return explicitTitle.trim();
        }
        const cleanKey = url ? url.split('/').pop().replace(/\.sb3?$/i, '') : '';
        const is19097 = (url && url.includes('19097')) ||
                        window.location.search.includes('19097') ||
                        [
                          '9097624', '9097732', '9097811', '10653299', '9098276', '2660241',
                          '9098728', '2660096', '9099214', '2660244'
                        ].includes(cleanKey);

        if (is19097) {
          if (PROJECT_TITLE_MAP[`19097_${cleanKey}`]) return PROJECT_TITLE_MAP[`19097_${cleanKey}`];
          if (PROJECT_TITLE_MAP[`19097_level_${level}`]) return PROJECT_TITLE_MAP[`19097_level_${level}`];
          if (PROJECT_TITLE_MAP[`19097_${level}`]) return PROJECT_TITLE_MAP[`19097_${level}`];
        }
        if (PROJECT_TITLE_MAP[cleanKey]) {
          return PROJECT_TITLE_MAP[cleanKey];
        }
        if (PROJECT_TITLE_MAP[`level_${level}`]) {
          return PROJECT_TITLE_MAP[`level_${level}`];
        }
        return cleanKey || 'Scratch Project';
      }

      function applyProjectTitle(title) {
        if (!title) return;
        const loader = window.__scratchProjectLoader;
        if (loader && loader.props && typeof loader.props.onSetProjectTitle === 'function') {
          try {
            loader.props.onSetProjectTitle(title);
          } catch (err) {
            console.warn('[AlgoLMS Bridge] Error setting project title on loader:', err);
          }
        }
        try {
          const titleInputs = document.querySelectorAll('input[class*="title-field"]');
          titleInputs.forEach(input => {
            if (input && input.value !== title) {
              input.value = title;
              input.dispatchEvent(new Event('input', { bubbles: true }));
              input.dispatchEvent(new Event('change', { bubbles: true }));
            }
          });
        } catch (err) {
          console.warn('[AlgoLMS Bridge] Error updating title input field:', err);
        }
      }

      // 4. Resolve & Load Project natively into Scratch VM
      function resolveProjectUrl(param, level) {
        const lvl = String(level || '1');
        if (param && (param.startsWith('/') || param.startsWith('http'))) return param;

        const is19097 = [
          '9097624', '9097732', '9097811', '10653299', '9098276', '2660241',
          '9098728', '2660096', '9099214', '2660244'
        ].includes(String(param)) ||
        String(param).includes('19097') ||
        String(param).includes('demo') ||
        window.location.search.includes('19097');

        if (is19097) {
          if (param && (/^\d+$/.test(param) || param.includes('demo'))) {
            return `/starter-projects/19097/${param}.sb3`;
          }
          if (lvl !== '6') {
            return `/starter-projects/19097/level_${lvl}.sb3`;
          }
          return null;
        }

        if (param && /^\d+$/.test(param) && param !== '8908684') {
          return `/starter-projects/18343/${param}.sb3`;
        }
        if (lvl !== '1' && lvl !== '12') {
          return `/starter-projects/18343/level_${lvl}.sb3`;
        }
        return null;
      }

      async function loadProjectFile(url) {
        if (!url) return false;
        console.log('[AlgoLMS Bridge] Fetching project:', url);
        try {
          const res = await fetch(url);
          if (!res.ok) {
            console.warn('[AlgoLMS Bridge] Failed to fetch project:', url, res.status);
            return false;
          }
          const arrayBuffer = await res.arrayBuffer();

          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm) {
            console.log('[AlgoLMS Bridge] Loading arrayBuffer directly into VM...');
            await vm.loadProject(arrayBuffer);
            console.log('[AlgoLMS Bridge] Project successfully loaded into VM!');
            if (typeof vm.emitTargetsUpdate === 'function') {
              vm.emitTargetsUpdate();
            }
            if (typeof vm.emitWorkspaceUpdate === 'function') {
              vm.emitWorkspaceUpdate();
            }
            const loader = window.__scratchProjectLoader;
            const finalTitle = resolveProjectTitle(url, levelParam, titleParam);
            applyProjectTitle(finalTitle);

            if (loader && loader.props) {
              if (loader.props.onLoadingFinished) {
                loader.props.onLoadingFinished(loader.props.loadingState, true);
              }
            }
            setTimeout(applyBlocklyToolbox, 100);
            setTimeout(applyBlocklyToolbox, 400);
            setTimeout(applyBlocklyToolbox, 1000);
            setTimeout(() => applyProjectTitle(finalTitle), 200);
            setTimeout(() => applyProjectTitle(finalTitle), 800);
            return true;
          }
        } catch (e) {
          console.error('[AlgoLMS Bridge] Error fetching or loading project:', e);
        }
        return false;
      }

      const initialProjectUrl = resolveProjectUrl(projectUrl, levelParam);
      const expectedTitle = resolveProjectTitle(initialProjectUrl, levelParam, titleParam);

      if (!initialProjectUrl) {
        // Level 1: Default Cat. Wait for Blockly workspace to be ready then apply Level 1 toolbox & title
        let checks = 0;
        const blocklyInterval = setInterval(() => {
          checks++;
          applyProjectTitle(expectedTitle);
          if (applyBlocklyToolbox()) {
            clearInterval(blocklyInterval);
            setTimeout(() => applyProjectTitle(expectedTitle), 200);
            setTimeout(() => applyProjectTitle(expectedTitle), 800);
          }
          if (checks > 100) {
            clearInterval(blocklyInterval);
          }
        }, 150);
      } else {
        // Levels 2+: Wait for Scratch VM to complete its initial boot, then load the starter .sb3
        let attempts = 0;
        let projectLoaded = false;
        const loaderCheck = setInterval(async () => {
          attempts++;
          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm && vm.runtime && Array.isArray(vm.runtime.targets) && vm.runtime.targets.length > 0 && !projectLoaded) {
            projectLoaded = true;
            clearInterval(loaderCheck);
            await loadProjectFile(initialProjectUrl);
          }
          if (attempts > 300) {
            clearInterval(loaderCheck);
          }
        }, 100);
      }

      // Listen for parent LMS postMessage
      window.addEventListener('message', async (e) => {
        if (!e.data) return;
        if (e.data.type === 'LOAD_SB3' && e.data.url) {
          await loadProjectFile(e.data.url);
        }
        if (e.data.type === 'SET_PROJECT_TITLE' && e.data.title) {
          applyProjectTitle(e.data.title);
        }
        if (e.data.type === 'UPDATE_CATEGORIES' && e.data.categories) {
          const newCats = String(e.data.categories).split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
          allowedCategories = newCats;
          if (allowedCategories.includes('variables') && !allowedCategories.includes('data')) allowedCategories.push('data');
          if (allowedCategories.includes('data') && !allowedCategories.includes('variables')) allowedCategories.push('variables');
          if (allowedCategories.includes('myblocks') && !allowedCategories.includes('procedures')) allowedCategories.push('procedures');
          if (allowedCategories.includes('procedures') && !allowedCategories.includes('myblocks')) allowedCategories.push('myblocks');

          const newDisallowed = isFullToolbox ? [] : allCategories.filter(c => !allowedCategories.includes(c));
          updateCssFilter(newDisallowed);
          applyBlocklyToolbox();
        }
      });
    })();
  </script>
