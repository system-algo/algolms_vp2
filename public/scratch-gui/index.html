<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico">
  <title>Scratch 3.0 GUI</title>
  <script defer="defer" src="gui.js"></script>
  <script>
    // Algo LMS Scratch Bridge - Precision Block & Category Filter
    (function() {
      const params = new URLSearchParams(window.location.search);
      const projectUrl = params.get('project') || '';
      const levelParam = params.get('level') || '1';
      const categoriesParam = params.get('categories') || 'motion,looks,events,control';
      const allowedCategories = categoriesParam.split(',').map(s => s.trim().toLowerCase());

      const allCategories = [
        'motion', 'looks', 'sound', 'events', 'control',
        'sensing', 'operators', 'variables', 'myblocks', 'data'
      ];
      // For level 2 and 3, strictly only looks and events are allowed!
      const isLevel2Or3 = levelParam === '2' || levelParam === '3';
      const effectiveAllowed = isLevel2Or3 ? ['looks', 'events'] : allowedCategories;
      const disallowed = allCategories.filter(c => !effectiveAllowed.includes(c));

      // Level 1 Authentic Algorithmics Toolbox XML
      const LEVEL_1_XML = `<xml id="toolbox" style="display: none">
  <category name="Motion" id="motion" colour="#4C97FF" secondaryColour="#3373CC">
    <block type="motion_movesteps">
      <value name="STEPS">
        <shadow type="math_number">
          <field name="NUM">10</field>
        </shadow>
      </value>
    </block>
    <block type="motion_gotoxy">
      <value name="X">
        <shadow type="math_number">
          <field name="NUM">0</field>
        </shadow>
      </value>
      <value name="Y">
        <shadow type="math_number">
          <field name="NUM">0</field>
        </shadow>
      </value>
    </block>
    <block type="motion_pointtowards">
      <value name="TOWARDS">
        <shadow type="motion_pointtowards_menu">
          <field name="TOWARDS">_mouse_</field>
        </shadow>
      </value>
    </block>
  </category>
  <category name="Looks" id="looks" colour="#9966FF" secondaryColour="#774DCB">
    <block type="looks_sayforsecs">
      <value name="MESSAGE">
        <shadow type="text">
          <field name="TEXT">Hello!</field>
        </shadow>
      </value>
      <value name="SECS">
        <shadow type="math_number">
          <field name="NUM">2</field>
        </shadow>
      </value>
    </block>
    <block type="looks_switchcostumeto">
      <value name="COSTUME">
        <shadow type="looks_costume">
          <field name="COSTUME">costume1</field>
        </shadow>
      </value>
    </block>
    <block type="looks_switchbackdropto">
      <value name="BACKDROP">
        <shadow type="looks_backdrops">
          <field name="BACKDROP">backdrop1</field>
        </shadow>
      </value>
    </block>
    <block type="looks_setsizeto">
      <value name="SIZE">
        <shadow type="math_number">
          <field name="NUM">100</field>
        </shadow>
      </value>
    </block>
    <block type="looks_say">
      <value name="MESSAGE">
        <shadow type="text">
          <field name="TEXT">Hello!</field>
        </shadow>
      </value>
    </block>
    <block type="looks_show"/>
    <block type="looks_hide"/>
  </category>
  <category name="Events" id="events" colour="#FFD500" secondaryColour="#CC9900">
    <block type="event_whenflagclicked"/>
  </category>
  <category name="Control" id="control" colour="#FFAB19" secondaryColour="#CF8B17">
    <block type="control_wait">
      <value name="DURATION">
        <shadow type="math_positive_number">
          <field name="NUM">1</field>
        </shadow>
      </value>
    </block>
  </category>
</xml>`;

      // Level 2 & 3 Authentic Algorithmics Toolbox XML (Looks & Events only)
      const LEVEL_2_XML = `<xml id="toolbox" style="display: none">
  <category name="Looks" id="looks" colour="#9966FF" secondaryColour="#774DCB">
    <block type="looks_sayforsecs">
      <value name="MESSAGE">
        <shadow type="text">
          <field name="TEXT">Hello!</field>
        </shadow>
      </value>
      <value name="SECS">
        <shadow type="math_number">
          <field name="NUM">2</field>
        </shadow>
      </value>
    </block>
    <block type="looks_switchcostumeto">
      <value name="COSTUME">
        <shadow type="looks_costume">
          <field name="COSTUME">costume1</field>
        </shadow>
      </value>
    </block>
    <block type="looks_switchbackdropto">
      <value name="BACKDROP">
        <shadow type="looks_backdrops">
          <field name="BACKDROP">backdrop1</field>
        </shadow>
      </value>
    </block>
  </category>
  <category name="Events" id="events" colour="#FFD500" secondaryColour="#CC9900">
    <block type="event_whenflagclicked"/>
  </category>
</xml>`;

      // 1. Inject targeted CSS rules to prevent flicker of disallowed categories
      const categoryClassMap = {
        motion: '.scratchCategoryId-motion',
        looks: '.scratchCategoryId-looks',
        sound: '.scratchCategoryId-sound',
        events: '.scratchCategoryId-events',
        control: '.scratchCategoryId-control',
        sensing: '.scratchCategoryId-sensing',
        operators: '.scratchCategoryId-operators',
        variables: '.scratchCategoryId-variables, .scratchCategoryId-data',
        myblocks: '.scratchCategoryId-myBlocks, .scratchCategoryId-procedures',
        data: '.scratchCategoryId-data'
      };

      const blockPrefixMap = {
        motion: 'g[data-category="motion"], g[data-id^="motion_"]',
        looks: 'g[data-category="looks"], g[data-id^="looks_"]',
        sound: 'g[data-category="sound"], g[data-id^="sound_"]',
        events: 'g[data-category="events"], g[data-id^="event_"]',
        control: 'g[data-category="control"], g[data-id^="control_"]',
        sensing: 'g[data-category="sensing"], g[data-id^="sensing_"], g[data-id="sensing_of"]',
        operators: 'g[data-category="operators"], g[data-id^="operator_"]',
        variables: 'g[data-category="data"], g[data-id^="data_"]',
        myblocks: 'g[data-category="myBlocks"], g[data-id^="procedures_"]'
      };

      const style = document.createElement('style');
      const cssRules = [];

      disallowed.forEach(cat => {
        if (categoryClassMap[cat]) {
          cssRules.push(`${categoryClassMap[cat]} { display: none !important; }`);
        }
        if (blockPrefixMap[cat]) {
          cssRules.push(`${blockPrefixMap[cat]} { display: none !important; }`);
        }
      });

      // Extra guarantee: hide sensing reporters & checkboxes in flyout if sensing is disallowed
      if (disallowed.includes('sensing')) {
        cssRules.push('g[data-id="sensing_of"], g[data-id*="sensing"] { display: none !important; }');
      }

      style.textContent = cssRules.join('\n');
      document.head.appendChild(style);

      // 2. Native Blockly updateToolbox hook
      function applyBlocklyToolbox() {
        if (!window.Blockly || !window.Blockly.getMainWorkspace) return false;
        const ws = window.Blockly.getMainWorkspace();
        if (!ws || !ws.options) return false;
        const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
        if (!vm || !vm.runtime || !Array.isArray(vm.runtime.targets) || vm.runtime.targets.length === 0) return false;

        try {
          if (levelParam === '2' || levelParam === '3' || (allowedCategories.length === 2 && allowedCategories.includes('looks') && allowedCategories.includes('events'))) {
            ws.updateToolbox(LEVEL_2_XML);
            return true;
          } else {
            // M1 Basic Toolbox (Motion, Looks, Events, Control)
            ws.updateToolbox(LEVEL_1_XML);
            return true;
          }
        } catch (err) {
          console.warn('[AlgoLMS Bridge] updateToolbox error:', err);
        }
        return false;
      }

      // 3. Resolve & Load Project natively into Scratch VM
      function resolveProjectUrl(param, level) {
        const lvl = String(level || '1');
        if (param && (param.startsWith('/') || param.startsWith('http'))) return param;
        if (param && /^\d+$/.test(param) && param !== '8908684') {
          return `/starter-projects/18343/${param}.sb3`;
        }
        if (lvl !== '1' && lvl !== '12') {
          return `/starter-projects/18343/level_${lvl}.sb3`;
        }
        return null;
      }

      async function loadProjectFile(url) {
        if (!url) return false;
        const filename = url.split('/').pop() || 'project.sb3';
        console.log('[AlgoLMS Bridge] Fetching project:', url);
        try {
          const res = await fetch(url);
          if (!res.ok) {
            console.warn('[AlgoLMS Bridge] Failed to fetch project:', url, res.status);
            return false;
          }
          const arrayBuffer = await res.arrayBuffer();

          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm) {
            console.log('[AlgoLMS Bridge] Loading arrayBuffer directly into VM...');
            await vm.loadProject(arrayBuffer);
            console.log('[AlgoLMS Bridge] Project successfully loaded into VM!');
            if (typeof vm.emitTargetsUpdate === 'function') {
              vm.emitTargetsUpdate();
            }
            if (typeof vm.emitWorkspaceUpdate === 'function') {
              vm.emitWorkspaceUpdate();
            }
            const loader = window.__scratchProjectLoader;
            if (loader && loader.props) {
              if (loader.props.onSetProjectTitle) {
                const title = filename.replace(/\.sb3?$/i, '');
                loader.props.onSetProjectTitle(title);
              }
              if (loader.props.onLoadingFinished) {
                loader.props.onLoadingFinished(loader.props.loadingState, true);
              }
            }
            setTimeout(applyBlocklyToolbox, 100);
            setTimeout(applyBlocklyToolbox, 400);
            setTimeout(applyBlocklyToolbox, 1000);
            return true;
          }
        } catch (e) {
          console.error('[AlgoLMS Bridge] Error fetching or loading project:', e);
        }
        return false;
      }

      const initialProjectUrl = resolveProjectUrl(projectUrl, levelParam);

      if (!initialProjectUrl) {
        // Level 1: Default Cat. Wait for Blockly workspace to be ready then apply Level 1 toolbox
        let checks = 0;
        const blocklyInterval = setInterval(() => {
          checks++;
          if (applyBlocklyToolbox()) {
            clearInterval(blocklyInterval);
          }
          if (checks > 100) {
            clearInterval(blocklyInterval);
          }
        }, 150);
      } else {
        // Levels 2+: Wait for Scratch VM to complete its initial boot, then load the starter .sb3
        let attempts = 0;
        let projectLoaded = false;
        const loaderCheck = setInterval(async () => {
          attempts++;
          const vm = window.vm || window.__scratchProjectLoader?.props?.vm;
          if (vm && vm.runtime && Array.isArray(vm.runtime.targets) && vm.runtime.targets.length > 0 && !projectLoaded) {
            projectLoaded = true;
            clearInterval(loaderCheck);
            await loadProjectFile(initialProjectUrl);
          }
          if (attempts > 300) {
            clearInterval(loaderCheck);
          }
        }, 100);
      }

      // Listen for parent LMS postMessage
      window.addEventListener('message', async (e) => {
        if (!e.data) return;
        if (e.data.type === 'LOAD_SB3' && e.data.url) {
          await loadProjectFile(e.data.url);
        }
      });
    })();
  </script>
</head>
<body></body>
</html>
